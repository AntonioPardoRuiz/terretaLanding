<header class="header">
  <app-container>
    <div class="header__inner">
      <a class="brand" routerLink="/" aria-label="Terreta, inicio" (click)="closeMenu()"
        ><img src="assets/brand/terreta-logo.png" width="960" height="260" alt="Terreta"
      /></a>
      <button
        class="menu-button"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="main-navigation"
        aria-label="Abrir o cerrar navegación"
        (click)="toggleMenu()"
      >
        <span></span><span></span><span></span>
      </button>
      <nav
        id="main-navigation"
        class="navigation"
        [class.navigation--open]="menuOpen()"
        aria-label="Navegación principal"
      >
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
          >Inicio</a
        >
        <a routerLink="/servicios" routerLinkActive="active" (click)="closeMenu()">Servicios</a>
        <a routerLink="/outsourcing" routerLinkActive="active" (click)="closeMenu()">Outsourcing</a>
        <a routerLink="/tarifas" routerLinkActive="active" (click)="closeMenu()">Tarifas</a>
        <a routerLink="/productos" routerLinkActive="active" (click)="closeMenu()">Productos</a>
        <a routerLink="/como-trabajamos" routerLinkActive="active" (click)="closeMenu()"
          >Cómo trabajamos</a
        >
        <a routerLink="/nosotros" routerLinkActive="active" (click)="closeMenu()">Nosotros</a>
        <a routerLink="/trabajar-con-nosotros" routerLinkActive="active" (click)="closeMenu()"
          >Trabajar con nosotros</a
        >
        <span class="navigation__cta"><app-button label="Contáctanos" link="/contacto" /></span>
        @if (crmUrl(); as url) {
          <a
            class="team-access"
            [href]="url"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Acceso equipo, abre el CRM en una pestaña nueva"
            (click)="closeMenu()"
            >Acceso equipo <span aria-hidden="true">↗</span></a
          >
        } @else {
          <span
            class="team-access team-access--pending"
            aria-disabled="true"
            title="URL del CRM pendiente de configuración"
            >Acceso equipo</span
          >
        }
      </nav>
    </div>
  </app-container>
</header>

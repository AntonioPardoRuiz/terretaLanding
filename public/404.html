<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <title>Página no encontrada | Terreta</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #344054;
      }
      * { box-sizing: border-box; }
      body {
        min-width: 20rem;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: clamp(4rem, 9vw, 6rem) clamp(1.125rem, 4vw, 1.75rem);
        background: radial-gradient(circle at 82% 28%, rgb(20 107 255 / 8%), transparent 25%), radial-gradient(circle at 95% 15%, rgb(0 184 240 / 8%), transparent 22%), #fff;
        text-align: center;
      }
      main { max-width: 46rem; }
      .eyebrow {
        display: inline-flex;
        padding: .45rem .7rem;
        border-radius: .45rem;
        background: #eef5ff;
        color: #146bff;
        font-size: .7rem;
        font-weight: 800;
        letter-spacing: .075em;
        text-transform: uppercase;
      }
      h1 {
        margin: 1rem 0;
        color: #101828;
        font-size: clamp(2.5rem, 6vw, 4.5rem);
        font-weight: 800;
        letter-spacing: -.035em;
      }
      p { margin: 0 0 2rem; color: #667085; }
      a {
        display: inline-flex;
        padding: .85rem 1.2rem;
        border-radius: .5rem;
        background: linear-gradient(135deg, #1359f4, #2088ff);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 9px 25px rgb(20 107 255 / 22%);
      }
      a:focus-visible { outline: 3px solid #8bc5ff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Error 404</span>
      <h1>Esta página no está disponible</h1>
      <p>Es posible que el enlace esté roto o que la página haya cambiado.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
